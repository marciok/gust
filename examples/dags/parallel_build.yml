# Parallel Build and Test Workflow
# This shell DAG demonstrates parallel task execution for a build pipeline.
# Both linting and unit tests run in parallel, then integration tests run after both complete.

tasks:
  - name: lint_code
    run: "cargo clippy --all-targets"
    cd: "/project"
    downstream: [integration_tests]
    env:
      RUST_BACKTRACE: "full"

  - name: unit_tests
    run: "cargo test --lib"
    cd: "/project"
    downstream: [integration_tests]
    env:
      RUST_BACKTRACE: "full"

  - name: integration_tests
    run: "cargo test --test '*'"
    cd: "/project"
    downstream: [build_release]
    env:
      RUST_BACKTRACE: "full"
    kill_timeout: 60000

  - name: build_release
    run: "cargo build --release"
    cd: "/project"
    downstream: [integration_tests]
    nice: 10
