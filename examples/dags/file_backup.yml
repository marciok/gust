# File Backup Workflow
# This is a simple shell DAG example that demonstrates sequential task execution
# with working directory control, environment variables, and output capture.
#
# Tasks:
# 1. Create archive: tar and compress files
# 2. Generate checksum: create MD5 for integrity verification
# 3. Move to backup: copy to backup directory

tasks:
  - name: create_archive
    run: "tar -czf backup.tar.gz *.txt *.log"
    cd: "/home/user/documents"
    downstream: [generate_checksum]

  - name: generate_checksum
    run: "md5sum backup.tar.gz > backup.tar.gz.md5"
    cd: "/home/user/documents"
    downstream: [move_to_backup]

  - name: move_to_backup
    run: "cp backup.tar.gz backup.tar.gz.md5 /backups/$(date +%Y-%m-%d)/"
    cd: "/home/user/documents"
    env:
      TZ: "UTC"
