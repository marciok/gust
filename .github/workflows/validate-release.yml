name: Validate release

# Validates that the project can be released: version pins agree, the Hex
# packages build, an app generated with setup_gust_app.sh passes the e2e/
# Playwright suite in dev and as a prod release, and the Docker images build.
# Runs on pull requests against main so breakage shows up before tagging, and
# is reused by publish.yml as its preflight.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Tag being published (e.g. v1.2.3). Defaults to gust_web's @version.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    concurrency:
      group: validate-release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    services:
      postgres:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/gust_web/assets/package-lock.json

      - name: Resolve release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ -z "${version}" ]]; then
            version="$(sed -n 's/^[[:space:]]*@version "\([^"]*\)".*/\1/p' apps/gust_web/mix.exs)"
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Validate release versions
        run: .github/scripts/check_release_versions.sh "${RELEASE_VERSION}"

      - name: Install NPM packages
        working-directory: apps/gust_web/assets
        run: npm ci

      - name: Build Gust web assets
        working-directory: apps/gust_web
        run: |
          mix deps.get
          mix compile
          mix assets.deploy

      - name: Build Hex packages
        run: |
          (cd apps/gust && mix hex.build --output "${RUNNER_TEMP}/gust.tar")
          (cd apps/gust_web && PUBLISH_DEP=true mix hex.build --output "${RUNNER_TEMP}/gust_web.tar")
          (cd apps/gust_py && PUBLISH_DEP=true mix hex.build --output "${RUNNER_TEMP}/gust_py.tar")
          (cd apps/gust_shell && PUBLISH_DEP=true mix hex.build --output "${RUNNER_TEMP}/gust_shell.tar")

      - name: Install Phoenix and Igniter generators
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex phx_new --force
          mix archive.install hex igniter_new --force

      - name: Generate and boot an app with setup_gust_app.sh
        run: .github/scripts/build_and_run.sh "${RELEASE_VERSION}" "${RUNNER_TEMP}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gust Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gust/Dockerfile
          target: final
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gust
          cache-to: type=gha,mode=max,scope=gust

      - name: Build gust-python Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gust/Dockerfile
          target: python
          build-args: GUST_WITH_PYTHON=true
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gust-python
          cache-to: type=gha,mode=max,scope=gust-python

      - name: Build gust-shell Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gust/Dockerfile
          target: final
          build-args: GUST_WITH_SHELL=true
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gust-shell
          cache-to: type=gha,mode=max,scope=gust-shell

      - name: Build gust-web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gust_web/Dockerfile
          target: final
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gust-web
          cache-to: type=gha,mode=max,scope=gust-web

      - name: Build gust-web-python Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gust_web/Dockerfile
          target: python
          build-args: GUST_WITH_PYTHON=true
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gust-web-python
          cache-to: type=gha,mode=max,scope=gust-web-python
