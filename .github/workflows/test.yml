name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (OTP ${{ matrix.otp-version }}, Elixir ${{ matrix.elixir-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp-version: ['29']
        elixir-version: ['1.18', '1.20']
    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      B64_SECRETS_CLOAK_KEY: PF4/V7ZLI8Nyjymua0eUy2K8q/lcSFi3USe3UUDb7sY=
      SECRET_KEY_BASE: dWKtgAuY24rgqDQCLkN9S5CaOqSFzdrnqO4iHqVlIp5uLQPB6MjVJqlEN7w1nOvX

    services:
      postgres:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}
          rebar3-version: '3.27.0'

      - name: Clear rebar3 plugin cache
        run: |
          rm -rf ~/.cache/rebar3 2>/dev/null || true
          rm -rf ~/.config/rebar3 2>/dev/null || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore npm cache
        uses: actions/cache@v3
        with:
          path: apps/gust_web/assets/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/gust_web/assets/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install deps
        run: mix deps.get

      - name: Install asset tools
        run: |
          npm install --prefix apps/gust_web/assets
          mix tailwind.install
          mix esbuild.install

      - name: Build assets
        run: |
          mix assets.build

      - name: Compile without errors
        run: |
          mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run lint
        run: mix lint

      - name: Create and migrate DB
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run tests
        run: |
          if [ "${{ matrix.otp-version }}" = "27" ] && [ "${{ matrix.elixir-version }}" = "1.18" ]; then
            mix coveralls.json --umbrella
          else
            mix test
          fi

      - name: Coveralls
        if: matrix.otp-version == '27' && matrix.elixir-version == '1.18'
        uses: coverallsapp/github-action@v2
        with:
          file: cover/excoveralls.json
